<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCC Bus Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="card-inner">
      <div class="brand-row">
        <div>
          <h1>MCC Bus Tracker</h1>
          <p class="subtitle">Campus Shuttle Status</p>
        </div>
        <span class="capacity-badge">30 Seats Total</span>
      </div>

      <div class="ph-clock" id="clock">--:--:-- PM</div>

      <div class="schedule-selectors">
        <div class="select-group">
          <label for="route-select">Select Route:</label>
          <select id="route-select" class="trip-dropdown">
            <option value="main-to-apex">Main Campus ➔ Apex Campus</option>
            <option value="apex-to-main">Apex Campus ➔ Main Campus</option>
          </select>
        </div>
      </div>

      <div id="status-box">
        <span id="status-icon">🚌</span>
        <div id="slot-count">
          <span class="available-num">24</span> Seats Available
        </div>
      </div>

      <div class="capacity-bar">
        <div class="capacity-bar-fill" style="width: 20%;"></div>
      </div>

      <div class="seat-section">
        <div class="section-heading">
          <h2>Select a Seat</h2>
          <span class="sync-indicator">Live Updates</span>
        </div>
        <div class="seat-grid">
          <div class="seat free"><span class="seat-num">01</span><span class="seat-badge">Free</span></div>
          <div class="seat free"><span class="seat-num">02</span><span class="seat-badge">Free</span></div>
          <div class="aisle-spacer"></div>
          <div class="seat reserved"><span class="seat-num">03</span><span class="seat-badge">Taken</span></div>
          <div class="seat free"><span class="seat-num">04</span><span class="seat-badge">Free</span></div>
          
          <div class="seat free"><span class="seat-num">05</span><span class="seat-badge">Free</span></div>
          <div class="seat mine"><span class="seat-num">06</span><span class="seat-badge">Yours</span></div>
          <div class="aisle-spacer"></div>
          <div class="seat free"><span class="seat-num">07</span><span class="seat-badge">Free</span></div>
          <div class="seat free"><span class="seat-num">08</span><span class="seat-badge">Free</span></div>
        </div>
      </div>

      <div id="controls">
        <button class="btn board">Reserve Seat</button>
        <button class="btn exit">Cancel Reservation</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Action completed!</div>

  <script src="script.js"></script>
</body>
</html>
