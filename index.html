<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B2140">
  <title>Coaster Seat Reservation</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <main class="card">
    <div class="card-inner">
      <div class="brand-row">
        <div>
          <h1>🎢 Coaster Reservation</h1>
          <p class="subtitle">Mabalacat City College</p>
        </div>
        <span class="capacity-badge">30 seats</span>
      </div>

      <div class="utility-row">
        <button id="switch-role-btn" class="link-btn" type="button">🔁 Switch Role</button>
      </div>

      <p id="ph-clock" class="ph-clock">🇵🇭 --:--:-- --</p>

      <section class="info-grid">
        <div class="info-item">
          <span>Operating hours</span>
          <strong>6:00 AM – 9:00 PM</strong>
        </div>
        <div class="info-item">
          <span>Interval</span>
          <strong>Every 20 mins</strong>
        </div>
      </section>

      <div id="status-box">
        <span id="status-icon">🎟️</span>
        <p id="slot-count">Loading...</p>
      </div>

      <div class="capacity-bar">
        <div id="capacity-bar-fill" class="capacity-bar-fill"></div>
      </div>

      <div id="availability-banner" class="availability-banner" hidden>
        <p id="availability-message">The driver has marked this coaster as unavailable right now.</p>
      </div>

      <section id="driver-panel" class="driver-panel" hidden>
        <div class="driver-panel-header">
          <h2>🚐 Driver Panel</h2>
          <button id="driver-logout" class="link-btn" type="button">Log out</button>
        </div>
        <div class="driver-buttons">
          <button id="mark-available-btn" class="btn board" type="button">✅ Available</button>
          <button id="mark-unavailable-btn" class="btn exit" type="button">🚫 Unavailable</button>
        </div>
        <div class="driver-buttons">
          <button id="mark-not-full-btn" class="btn board" type="button">🟢 Not Full</button>
          <button id="mark-full-btn" class="btn exit" type="button">🔴 Full</button>
        </div>
        <p id="driver-current-status" class="driver-current-status"></p>
      </section>

      <section class="seat-section">
        <div class="section-heading">
          <h2>Live seat slots</h2>
          <span id="sync-indicator" class="sync-indicator">Connecting…</span>
        </div>
        <div id="seat-grid" class="seat-grid"></div>
      </section>

      <div class="schedule-selectors">
  <div class="select-group">
    <label for="select-dapdap-mabiga"><strong>MCC Dapdap to Mabiga</strong></label>
    <select id="select-dapdap-mabiga" class="trip-dropdown">
      <option value="" disabled selected>-- Select Time --</option>
    </select>
  </div>

  <div class="select-group">
    <label for="select-mabiga-dapdap"><strong>Mabiga to MCC Dapdap</strong></label>
    <select id="select-mabiga-dapdap" class="trip-dropdown">
      <option value="" disabled selected>-- Select Time --</option>
    </select>
  </div>
</div>

      <section id="reservation-panel" class="reservation-panel" hidden>
        <p id="reservation-trip"></p>
        <div class="timer-wrap">
          <span>Expires in:</span>
          <strong id="reservation-timer">10:00</strong>
        </div>
        <div id="checkin-qr" class="checkin-qr"></div>
      </section>

      <div id="controls">
        <button id="reserve-btn" class="btn board">Reserve Seat</button>
        <button id="cancel-btn" class="btn exit" hidden>Cancel Reservation</button>
      </div>
    </div>
  </main>

  <div id="role-select-screen" class="modal-overlay" hidden>
    <div class="modal-card">
      <h2>Select Role</h2>
      <button id="role-student-btn" class="btn board" style="margin-bottom:8px;">🎓 Student</button>
      <button id="role-driver-btn" class="btn exit">🚐 Driver</button>
    </div>
  </div>

  <div id="login-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <h2>Driver Login</h2>
      <form id="login-form">
        <label class="field-label">Email</label>
        <input type="email" id="login-email" required>
        <label class="field-label">Password</label>
        <input type="password" id="login-password" required>
        <p id="login-error" class="login-error" hidden></p>
        <div class="modal-actions">
          <button type="submit" class="btn board">Log In</button>
          <button type="button" id="login-cancel" class="btn exit">Back</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
