<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coaster Slot Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card-bg" aria-hidden="true"></div>

    <div class="card-inner">
      <h1>🎢 Coaster Status</h1>
      <p class="subtitle">Mabalacat City College</p>
      <p id="ph-clock" class="ph-clock">--:--:-- --</p>

      <div id="status-box">
        <span id="status-icon">🎟️</span>
        <p id="slot-count">Loading...</p>
        <p id="next-free" class="next-free"></p>
      </div>

      <div id="schedule-banner" class="schedule-banner" hidden>
        <p id="schedule-message"></p>
      </div>

      <div id="controls">
        <button id="board-btn" class="btn board">Board</button>
        <button id="exit-btn" class="btn exit">Exit</button>
      </div>

      <div class="qr-section">
        <p>Scan to check live status</p>
        <img src="qr-code.png" alt="Scan to check coaster status" id="qr-image">
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
